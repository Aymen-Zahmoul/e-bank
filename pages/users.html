<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUREX BANK | Users</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    
    
    <link rel="stylesheet" href="../css/tailwind-compiled.css">
</head>
<body class="bg-[#f7f9fc] text-[#191c1e] font-sans antialiased">

        <div class="with-sidebar">
            <div id="admin-sidebar"></div>
            <div class="content-area p-8 w-full max-w-[1400px]">
                <div class="p-8 space-y-8 max-w-[1400px]">
    <header class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-2xl font-bold text-[#00081e]">User Management</h2>
            <p class="text-sm text-slate-500">Manage global client accounts and permissions.</p>
        </div>
        <button class="btn-primary">Create New Account</button>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <div class="flex items-center bg-slate-50 rounded-full px-4 py-2 w-80">
                <span class="material-symbols-outlined text-slate-400 mr-2 text-sm">search</span>
                <input class="bg-transparent border-none focus:ring-0 text-sm w-full" placeholder="Search users by name or email..."/>
            </div>
            <div class="flex gap-2">
                <button class="px-4 py-2 text-xs font-bold border border-slate-200 rounded-md text-slate-600 hover:bg-slate-50 transition-all">Export</button>
                <button class="px-4 py-2 text-xs font-bold border border-slate-200 rounded-md text-slate-600 hover:bg-slate-50 transition-all">Bulk Action</button>
            </div>
        </div>
        <table class="w-full text-left">
            <thead>
                <tr class="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                    <th class="px-6 py-4">User</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4">Tier</th>
                    <th class="px-6 py-4">Joined Date</th>
                    <th class="px-6 py-4">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img class="w-10 h-10 rounded-full object-cover" src="https://picsum.photos/seed/u1/100/100" referrerPolicy="no-referrer"/>
                            <div>
                                <p class="text-sm font-bold text-[#00081e]">Alexander Thorne</p>
                                <p class="text-[10px] text-slate-400">a.thorne@example.com</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 bg-green-50 text-green-700 text-[10px] font-bold rounded-full uppercase">Active</span>
                    </td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-600">Private Wealth</td>
                    <td class="px-6 py-4 text-sm text-slate-500">Jan 12, 2023</td>
                    <td class="px-6 py-4">
                        <button class="text-slate-400 hover:text-[#00081e] transition-colors">
                            <span class="material-symbols-outlined">edit</span>
                        </button>
                    </td>
                </tr>
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img class="w-10 h-10 rounded-full object-cover" src="https://picsum.photos/seed/u2/100/100" referrerPolicy="no-referrer"/>
                            <div>
                                <p class="text-sm font-bold text-[#00081e]">Elena Rodriguez</p>
                                <p class="text-[10px] text-slate-400">e.rod@global.co</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 bg-orange-50 text-orange-700 text-[10px] font-bold rounded-full uppercase">Pending KYC</span>
                    </td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-600">Standard</td>
                    <td class="px-6 py-4 text-sm text-slate-500">Sept 05, 2024</td>
                    <td class="px-6 py-4">
                        <button class="text-slate-400 hover:text-[#00081e] transition-colors">
                            <span class="material-symbols-outlined">edit</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

            </div>
        </div>
        
    <script src="../js/components.js"></script>
</body>
</html>
