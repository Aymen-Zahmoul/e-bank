<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUREX BANK | Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-main: #191c1e;
            --text-dark: #00081e;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --primary: #005cab;
            --primary-hover: #0a1f44;
            --container-bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --transition: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            transition-property: background-color, border-color, color, fill, stroke, box-shadow, transform, opacity;
            transition-duration: var(--transition);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        a {
            text-decoration: none;
        }

        .main-content {
            transition: opacity 0.5s ease;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--container-bg);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            color: var(--primary);
            font-size: 2.25rem !important;
        }

        .logo-text {
            font-family: 'Manrope', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-dark);
            text-transform: uppercase;
            margin: 0;
        }

        .login-title {
            font-family: 'Manrope', sans-serif;
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.025em;
            margin: 0;
        }

        .login-card {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-social {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background-color: var(--white);
            color: #334155;
            font-family: inherit;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-social:hover {
            background-color: #f8fafc;
        }

        .btn-social img {
            width: 1.25rem;
            height: 1.25rem;
        }

        .btn-social .material-symbols-outlined {
            font-size: 1.25rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .divider-line {
            height: 1px;
            flex: 1;
            background-color: var(--border);
        }

        .divider-text {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .forgot-link {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--primary);
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .form-input {
            width: 100%;
            background-color: #f8fafc;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 0.75rem 1rem;
            color: #0f172a;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 0.375rem 0.375rem 0 0;
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-bottom-color: var(--primary);
            background-color: #f1f5f9;
        }

        .btn-submit {
            width: 100%;
            color: white;
            padding: 1rem;
            border-radius: 0.375rem;
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
            transition-duration: 200ms;
        }

        .btn-submit:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .signup-text {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-light);
            margin: 0;
        }

        .signup-link {
            color: var(--primary);
            font-weight: 600;
        }

        .signup-link:hover {
            color: var(--text-dark);
        }

        .login-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #f1f5f9;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-light);
        }

        .security-badge .material-symbols-outlined {
            font-size: 0.875rem;
        }

        .footer-text {
            font-size: 0.625rem;
            line-height: 1.6;
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: -0.05em;
            padding: 0 1rem;
            margin: 0;
        }

        /* Essential utility class from global style if needed */
        .hero-gradient {
            background: linear-gradient(135deg, #00081e 0%, #0a1f44 100%);
        }

        #loader-container {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 50;
            background-color: var(--bg-color);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
    <link rel="stylesheet" href="../css/tailwind-compiled.css">
</head>
<body>
    <main class="main-content">
        <div class="login-wrapper">
            <div class="login-container">
                <header class="login-header">
                    <div class="logo-group">
                        <span class="material-symbols-outlined logo-icon">account_balance</span>
                        <h1 class="logo-text">AUREX BANK</h1>
                    </div>
                    <h2 class="login-title">Sign in to AUREX</h2>
                </header>
                
                <div class="login-card">
                    <div class="social-buttons">
                        <button id="google-login" class="btn-social" type="button">
                            <img alt="Google Logo" src="https://www.google.com/favicon.ico" referrerPolicy="no-referrer"/>
                            <span>Continue with Google</span>
                        </button>
                        <button id="apple-login" class="btn-social" type="button">
                            <span class="material-symbols-outlined">apple</span>
                            <span>Continue with Apple</span>
                        </button>
                    </div>
                    
                    <div class="divider">
                        <div class="divider-line"></div>
                        <span class="divider-text">or</span>
                        <div class="divider-line"></div>
                    </div>
                    
                    <form id="login-form" class="login-form">
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address</label>
                            <input class="form-input" id="email" placeholder="name@company.com" type="email" required/>
                        </div>
                        <div class="form-group">
                            <div class="label-row">
                                <label class="form-label" for="password">Password</label>
                                <a href="#" class="forgot-link">Forgot?</a>
                            </div>
                            <input class="form-input" id="password" placeholder="••••••••" type="password" required/>
                        </div>
                        
                        <button id="login-btn" class="btn-submit hero-gradient" type="submit">
                            Sign In Securely
                        </button>
                    </form>

                    <p class="signup-text">
                        Don't have an account? 
                        <a class="signup-link" href="signup.html">Request Access</a>
                    </p>
                </div>
                
                <footer class="login-footer">
                    <div class="security-badge">
                        <span class="material-symbols-outlined">lock</span>
                        <span>SECURED BY AUREX SHIELD TECHNOLOGY</span>
                    </div>
                    <p class="footer-text">
                        By signing in, you agree to our Terms of Service and Privacy Policy. <br/> 
                        © 2024 AUREX BANK. Member FDIC. Equal Housing Lender.
                    </p>
                </footer>
            </div>
        </div>
    </main>
        
    <!-- E-Banking Loader (Hidden by default) -->
    <div id="loader-container">
        <div class="ebanking-loader-container">
            <div class="css-credit-card">
                <div class="card-sweep"></div>
                <div class="card-chip"></div>
                <div class="card-contactless">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
            <div class="loader-text">
                Authorizing<span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    </div>
        
    <script src="../js/components.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission naturally without storing
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(email && password) {
                // Ensure harmony by smoothly transitioning elements
                const mainContent = document.querySelector('.main-content');
                mainContent.style.opacity = '0';
                
                setTimeout(() => {
                    mainContent.style.display = 'none';
                    const loader = document.getElementById('loader-container');
                    loader.style.display = 'flex';
                    loader.style.opacity = '0';
                    loader.style.transition = 'opacity 0.5s ease';
                    
                    // Force a browser reflow before changing opacity to trigger transition
                    void loader.offsetWidth; 
                    loader.style.opacity = '1';
                    
                }, 500);
                
                // Transition to dashboard after the animation duration (2.5s)
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                }, 3500);
            }
        });
    </script>
</body>
</html>
